<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tussock Scoring</title>
<meta name="description" content="Live golf competition scoring: stroke play, Stableford and pairs better-ball.">
<!-- Ask search engines and AI crawlers not to index, cache, preview or train on this page. Honoured by well-behaved crawlers only. -->
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex, noai, noimageai">
<meta name="googlebot" content="noindex, nofollow">
<meta name="bingbot" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 22 26'%3E%3Cpath d='M4 1v24' stroke='%231E5B3A' stroke-width='2.4' stroke-linecap='round'/%3E%3Cpath d='M5 2l14 5-14 5z' fill='%231E5B3A'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: a club's manual leaderboard — condensed board type, under-par in red, scorecard grid underneath; one centred column, tabs per competition. */
:root{
  --bg:#F3F5EF; --surface:#FFFFFF; --sunk:#E8ECE3; --fg:#18221C; --muted:#5D6B61; --line:#D3DACD;
  --accent:#1E5B3A; --accent-fg:#FFFFFF; --accent-soft:#DCEADF;
  --under:#C4271F; --over:#18221C; --warn:#9A6400;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1512; --surface:#18211C; --sunk:#202B25; --fg:#E5ECE6; --muted:#97A69C; --line:#2E3B33;
  --accent:#6CC294; --accent-fg:#0F1512; --accent-soft:#1E3529; --under:#FF7066; --over:#E5ECE6; --warn:#E3B04B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1512; --surface:#18211C; --sunk:#202B25; --fg:#E5ECE6; --muted:#97A69C; --line:#2E3B33;
  --accent:#6CC294; --accent-fg:#0F1512; --accent-soft:#1E3529; --under:#FF7066; --over:#E5ECE6; --warn:#E3B04B; color-scheme:dark}

/* The hidden attribute must win over display rules like .stack{display:flex} and button{display:inline-flex}. */
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5}
*{box-sizing:border-box}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 64px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 10px;flex-wrap:wrap}
.brand-block{display:flex;align-items:center;gap:14px}
.logo-link{display:block;line-height:0}
.logo{width:64px;height:64px;border-radius:50%;display:block}/* round crop hides the image's white corners in dark mode */
.brand{font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);text-decoration:none;display:flex;align-items:center;gap:10px}
.brand svg{flex:none}
h1,h2,h3{font-family:var(--f-display);font-weight:700;text-wrap:balance;margin:0;line-height:1.1}
h1{font-size:clamp(30px,6vw,44px);letter-spacing:.01em}
h2{font-size:24px}
h3{font-size:18px;letter-spacing:.02em}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
button,.btn{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:var(--r);padding:8px 14px;cursor:pointer;min-height:40px;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
button:hover,.btn:hover{border-color:var(--muted)}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary,.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
button.ghost{background:transparent;border-color:transparent;color:var(--muted)}
button.danger{color:var(--under);border-color:var(--under);background:transparent}
button:disabled{opacity:.45;cursor:not-allowed}
input,select{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;min-height:40px;width:100%;min-width:0}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted);min-width:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px}
.stack{display:flex;flex-direction:column;gap:16px}
.note{font-size:13px;color:var(--muted)}
.banner{border:1px dashed var(--line);border-radius:10px;padding:12px 14px;font-size:14px;background:var(--sunk)}
.banner.sample{border-color:var(--warn);color:var(--fg)}
.pill{display:inline-flex;align-items:center;font-size:12px;font-weight:600;letter-spacing:.04em;padding:2px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.pill.warn{background:transparent;border:1px solid var(--warn);color:var(--warn)}
.pill.live{background:var(--under);color:#fff}

/* Competition list */
.comps{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.comp-card{display:flex;flex-direction:column;gap:6px;text-align:left;align-items:flex-start;padding:16px;min-height:0;border-radius:10px}
.comp-card .t{font-family:var(--f-display);font-size:22px;font-weight:700;line-height:1.1}
.empty{padding:28px;text-align:left}

/* Comp header + tabs */
.comp-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;padding-block:8px 14px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
.tabs button{white-space:nowrap;flex:none;border:none;border-bottom:3px solid transparent;border-radius:0;background:none;color:var(--muted);font-family:var(--f-display);font-size:18px;letter-spacing:.04em;text-transform:uppercase;padding:8px 14px}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}

/* Leaderboard */
.board-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table.board{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.board .m-line{display:none}
/* Leaderboard cell rules use ">" so they don't reach the scorecard table nested inside an expanded row. */
.board>thead>tr>th{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:right;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--sunk)}
.board>thead>tr>th:nth-child(2),.board>tbody>tr>td:nth-child(2){text-align:left}
.board>tbody>tr>td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:right;vertical-align:middle}
.board tr.ent{cursor:pointer}
.board>tbody>tr.ent:hover>td{background:var(--sunk)}
.board .pos{font-family:var(--f-display);font-weight:700;font-size:22px;width:56px;text-align:left}
.board .nm{font-weight:600}
.board .netv{font-weight:700;color:var(--fg)}
.board .sub{font-size:12px;color:var(--muted);font-weight:400}
.board .big{font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1}
.u{color:var(--under)} .o{color:var(--over)}
.cb{font-size:10px;font-weight:600;letter-spacing:.06em;color:var(--muted);vertical-align:super;margin-left:3px}
.board>tbody>tr.card-row>td{padding:0 0 12px;background:var(--surface)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.seg button{border:none;border-radius:0;min-height:34px;padding:4px 12px;background:var(--surface);color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.seg.kind{display:flex;max-width:100%}
.seg.kind button{flex:1 1 0;min-height:44px;font-family:var(--f-display);font-size:17px;letter-spacing:.03em;text-transform:uppercase;padding:6px 12px;line-height:1.1}

/* Scorecard grid */
.sc-wrap{overflow-x:auto;padding:0 12px;width:0;min-width:100%}/* width:0 keeps the wide card from stretching the leaderboard; it scrolls on its own */
table.sc{border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:13px;min-width:720px;width:100%}
.sc th,.sc td{border:1px solid var(--line);text-align:center;padding:4px 2px;min-width:30px}
.sc th{font-weight:600;color:var(--muted);background:var(--sunk);font-size:11px}
.sc td.lbl,.sc th.lbl{text-align:left;padding-inline:8px;min-width:64px;color:var(--muted);font-weight:600;font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.sc td.tot{font-weight:700;background:var(--sunk)}
.mk{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;font-weight:600}
.mk.eagle{border-radius:50%;box-shadow:0 0 0 1.5px var(--under),0 0 0 3.5px var(--surface),0 0 0 5px var(--under);color:var(--under)}
.mk.birdie{border-radius:50%;box-shadow:0 0 0 1.5px var(--under);color:var(--under)}
.mk.bogey{box-shadow:0 0 0 1.5px var(--fg)}
.mk.dbl{box-shadow:0 0 0 1.5px var(--fg),0 0 0 3.5px var(--surface),0 0 0 5px var(--fg)}
.dots{letter-spacing:1px;color:var(--accent);font-size:11px;line-height:1}

/* Score entry */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border-radius:99px;min-height:36px;padding:4px 14px;font-weight:500}
.cgroups{display:flex;flex-direction:column;gap:12px}
.cgroup{display:flex;flex-direction:column;gap:6px;padding-top:10px;border-top:1px solid var(--line)}
.cgroup:first-child{border-top:none;padding-top:0}
.cgroup-head{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:32px}
.cgroup-head .sm{min-height:32px;padding:2px 10px;font-size:13px}
.cgroup-head .sm[aria-pressed="true"]{color:var(--accent);font-weight:600}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.holes{display:grid;grid-template-columns:repeat(9,1fr);gap:4px}
.holes button{min-height:38px;padding:0;font-family:var(--f-display);font-size:18px;position:relative}
.holes button.done{background:var(--accent-soft);border-color:var(--accent-soft)}
.holes button[aria-current="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.hole-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.hole-head .h{font-family:var(--f-display);font-weight:700;font-size:44px;line-height:1}
.hole-head .meta{display:flex;gap:16px;font-family:var(--f-display);font-size:20px;font-weight:600;color:var(--muted)}
.hole-head .meta b{color:var(--fg);font-size:28px}
.prow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding-block:12px;border-top:1px solid var(--line)}
.prow .who{min-width:0}
.prow .who .n{font-weight:600;overflow-wrap:anywhere;font-size:19px;line-height:1.25}
.prow .who .dots{font-size:20px;letter-spacing:2px;vertical-align:middle}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:48px;height:48px;font-size:24px;padding:0}
.stepper .val{width:56px;text-align:center;font-family:var(--f-display);font-weight:700;font-size:36px;line-height:1}
.stepper .val{display:flex;align-items:center;justify-content:center;height:56px}
.stepper .val .mk{width:42px;height:42px;font:inherit}
.stepper .val .mk.eagle{box-shadow:0 0 0 2px var(--under),0 0 0 4px var(--surface),0 0 0 6px var(--under)}
.stepper .val .mk.birdie{box-shadow:0 0 0 2px var(--under)}
.stepper .val .mk.bogey{box-shadow:0 0 0 2px var(--fg)}
.stepper .val .mk.dbl{box-shadow:0 0 0 2px var(--fg),0 0 0 4px var(--surface),0 0 0 6px var(--fg)}
.stepper .pk{width:auto;font-size:14px;padding:0 10px}
.res{font-size:12px;color:var(--muted)}
/* Under-par shouts: floating cards at the top of the page, newest first. */
.shouts{position:fixed;left:50%;transform:translateX(-50%);top:calc(12px + env(safe-area-inset-top,0px));width:calc(100% - 32px);max-width:520px;z-index:30;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.shout{pointer-events:auto;display:flex;align-items:center;gap:12px;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-left:5px solid var(--under);border-radius:8px;padding:10px 8px 10px 14px;box-shadow:0 8px 24px rgba(0,0,0,.18);animation:shout-in .35s ease-out}
.shout .w{font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1;color:var(--under);text-transform:uppercase;letter-spacing:.03em;flex:none}
.shout .d{flex:1;min-width:0;font-size:14px;line-height:1.35}
.shout .d b{font-weight:600}
.shout .x{flex:none;width:44px;height:44px;min-height:44px;padding:0;border:none;background:transparent;color:var(--muted);font-size:22px;line-height:1}
.shout .x:hover{color:var(--fg);background:var(--sunk)}
@keyframes shout-in{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.shout{animation:none}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;max-width:calc(100% - 32px);z-index:20}

/* Setup */
.course-wrap{overflow-x:auto}
table.course{border-collapse:collapse;min-width:640px;width:100%}
.course th,.course td{border:1px solid var(--line);padding:2px;text-align:center}
.course th{font-size:11px;color:var(--muted);background:var(--sunk);padding:4px}
.course input{min-height:32px;padding:2px;text-align:center;border:none;border-radius:0;background:transparent}
.course td.lbl,.course th.lbl{text-align:left;padding-inline:8px;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
.elist{display:flex;flex-direction:column}
.erow{display:flex;gap:10px;align-items:center;justify-content:space-between;padding-block:10px;border-top:1px solid var(--line);flex-wrap:wrap}
.erow .who{min-width:0;flex:1 1 180px}
.ecount{flex:none;align-self:flex-start;min-width:2ch;text-align:right;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}/* display-only entry number */
.err{color:var(--under);font-size:13px}
.code{font-family:var(--f-mono);font-size:12px;font-weight:500;letter-spacing:.08em;padding:1px 7px;border:1px solid var(--line);border-radius:4px;color:var(--fg);background:var(--sunk)}
#f-code{font-family:var(--f-mono);text-transform:uppercase;letter-spacing:.08em}
@media (max-width:560px){
  .tabs{gap:0}
  .tabs button{font-size:16px;padding:8px 10px;letter-spacing:.02em}
  .comp-head .btn.ghost{display:none}
  /* Phones: logo on the left, name and sign-in stacked beside it, to keep the header short. */
  header.top{display:grid;grid-template-columns:auto 1fr;column-gap:12px;row-gap:4px;align-items:center;padding-block:10px 8px}
  .brand-block{display:contents}
  .logo-link{grid-row:1 / span 2}
  .logo{width:60px;height:60px}
  .brand{grid-column:2;font-size:20px}
  .top-right{grid-column:2}
  .board .c-wide{display:none}
  .board .m-line{display:block}
  .board>thead>tr>th,.board>tbody>tr>td{padding:8px 6px}
  .board>thead>tr>th:first-child,.board>tbody>tr>td:first-child{padding-left:10px}
  .board>thead>tr>th:last-child,.board>tbody>tr>td:last-child{padding-right:10px}
  .board .pos{width:44px;font-size:19px}
  .board .big{font-size:23px}
  .board .nm{overflow-wrap:anywhere}
  .seg.kind .lg{display:none}
  .holes button{min-height:34px;font-size:16px}
  /* Four tabs and the six-column stats table both fit a phone without sideways scrolling. */
  .tabs button{font-size:15px;padding:8px 7px;letter-spacing:0}
  .stepper button{width:44px;height:44px}
  .hole-head .h{font-size:36px}
}
@media (prefers-reduced-motion:no-preference){button{transition:background .12s,border-color .12s,color .12s}}
.top-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.who-chip{font-size:13px;color:var(--muted);max-width:22ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top-right button{min-height:34px;padding:4px 12px;font-size:14px}
.join{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.join label.f{flex:1 1 180px}
#j-code{font-family:var(--f-mono);text-transform:uppercase;letter-spacing:.08em}
/* Stats: score-type dots */
.stats-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table.stats{width:100%;border-collapse:collapse}
.stats th{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);background:var(--sunk);white-space:nowrap}
.stats td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.stats tbody tr:last-child td{border-bottom:none}
.stats td.nm{font-weight:600;min-width:7.5em}
.sdots{display:flex;flex-wrap:wrap;gap:3px;max-width:84px;min-height:9px}
.sd{display:block;width:9px;height:9px;border-radius:50%;background:var(--muted)}
.sd.eagle{background:var(--under);box-shadow:0 0 0 1.5px var(--surface),0 0 0 3px var(--under);margin:2px}
.sd.birdie{background:var(--under)}
.sd.par{background:var(--accent)}
.sd.bogey{background:transparent;box-shadow:inset 0 0 0 1.5px var(--fg);border-radius:1px}
.sd.dbl{background:var(--fg);border-radius:1px}
.sd.worse{background:var(--fg);border-radius:1px;transform:rotate(45deg) scale(.85)}
.stats .sml{display:none}
.stats-box{margin-top:18px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.stats-box>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:10px;flex-wrap:wrap}
.stats-box>summary::-webkit-details-marker{display:none}
.stats-box>summary:hover{background:var(--sunk)}
.stats-box>summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.stats-box .sum-t{font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:.04em;text-transform:uppercase}
.stats-box .sum-d{font-size:13px;color:var(--muted);flex:1 1 12em;min-width:0}
.stats-box .chev{flex:none;color:var(--muted);transition:transform .15s}
.stats-box[open] .chev{transform:rotate(180deg)}
.stats-box[open]>summary{border-bottom:1px solid var(--line);border-radius:10px 10px 0 0}
.stats-body{padding:14px 16px 16px}
@media (prefers-reduced-motion:reduce){.stats-box .chev{transition:none}}
/* Phones: the six score columns share the width evenly, with short headings. (After the rules above so it wins.) */
@media (max-width:560px){
  .stats .c-holes{display:none}
  table.stats{table-layout:fixed}
  .stats th:first-child{width:24%}
  .stats th,.stats td{padding:8px 2px}
  .stats th:first-child,.stats td:first-child{padding-left:8px}
  .stats th{letter-spacing:0;font-size:9px;white-space:normal}
  .stats .lgl{display:none}
  .stats .sml{display:inline}
  .stats td.nm{min-width:0;font-size:13px;overflow-wrap:anywhere}
  .sdots{max-width:none;gap:2px}
  .sd{width:7px;height:7px}
  .sd.eagle{margin:1.5px}
}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.uid{font-family:var(--f-mono);font-size:12px;user-select:all;overflow-wrap:anywhere}
.cinfo{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin:0}
.cinfo dt{font-size:13px;font-weight:600;color:var(--muted)}
.cinfo dd{margin:2px 0 0;font-size:16px;font-weight:500}
.course.ro{table-layout:fixed}
.course.ro th.lbl{width:60px}
.course.ro td{padding:6px 2px;font-variant-numeric:tabular-nums}
.course.ro td.tot,.course.ro th:nth-child(11),.course.ro th:nth-child(21),.course.ro th:nth-child(22){font-weight:700;background:var(--sunk)}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="brand-block">
    <a class="logo-link" href="#home" tabindex="-1" aria-hidden="true"><img class="logo" src="logo.jpg" alt="" width="240" height="240"></a>

      Tussock Scoring

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";

import {initializeFirestore,persistentLocalCache,persistentMultipleTabManager,collection as fsCollection,doc as fsDoc,onSnapshot,addDoc,updateDoc,setDoc,deleteDoc,getDoc,getDocs,deleteField,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
import {firebaseConfig} from "./firebase-config.js";
(function(){
"use strict";
const PAR_DEFAULT=[4,4,3,5,4,4,3,4,5,4,3,5,4,4,4,3,4,5];
const SI_DEFAULT=[7,11,17,1,5,9,15,13,3,8,16,2,10,4,14,18,12,6];
const FORMATS={
  stroke:{label:"Stroke play",scoring:"strokes",allowance:95,blurb:"Individual medal. Net and gross leaderboards."},
  stableford:{label:"Stableford",scoring:"points",allowance:95,blurb:"Individual. Points per hole against your net score."},
  betterball:{label:"Better-ball Stableford",scoring:"points",allowance:85,blurb:"Pairs. The better points score of the two counts on each hole."},
  scramble:{label:"Team scramble",scoring:"strokes",allowance:100,blurb:"Each team plays one ball. Net stroke play off a team handicap."}
};
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const LS={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

const S={db:null,fb:null,authUser:null,isAdmin:false,joined:{},secrets:{},dbState:"connecting",readOnly:false,
  comps:[],compsLoaded:false,compsSlow:false,entries:{},entriesLoaded:{},
  view:"home",compId:null,tab:"board",boardMode:"net",boardKind:(LS.get("kind")==="team"?"team":"ind"),openCard:null,hole:1,editEntry:null,confirm:null};
const pending={};

/* ---------- sample competition (in memory only) ---------- */
function mkScores(arr){const o={};arr.forEach((v,i)=>{if(v!=null)o[i+1]=v});return o}
const SAMPLE={id:"sample",local:true,code:"SAMPLE1",name:"Sample: November Medal",date:"2026-11-14",format:"stroke",allowance:95,teams:{enabled:true,allowance:85},
  course:{name:"Sample course, white tees",slope:128,rating:71.4,pars:PAR_DEFAULT.slice(),si:SI_DEFAULT.slice()}};
const SAMPLE_ENTRIES=[
  {id:"s1",name:"A. Player",index:8.4,team:"Pair 1",scores:mkScores([4,5,3,5,4,4,2,5,5,4,3,6,4,5,4,3,4,5])},
  {id:"s2",name:"B. Player",index:14.2,team:"Pair 2",scores:mkScores([5,4,4,6,5,4,3,5,5,5,4,5,4,5,5,3,5,6])},
  {id:"s3",name:"C. Player",index:3.1,team:"Pair 1",scores:mkScores([4,4,3,4,4,5,3,4,5,4,3,5,4,4,4,3])},
  {id:"s4",name:"D. Player",index:21.6,team:"Pair 2",scores:mkScores([6,5,4,6,5,6,4,5,7,5,4,6,"P",5,5,4,5,6])},
  {id:"s5",name:"E. Player",index:11.0,scores:mkScores([5,4,3,5,5,4,3,5,6,4,4,5])}
];

/* ---------- handicap + scoring ---------- */
const sum=a=>a.reduce((x,y)=>x+y,0);
function coursePar(c){return sum(c.pars)}
function playingHcp(e,comp){
  const idx=Number(e.index)||0;
  if(comp.format==="scramble")return Math.round(idx);
  const c=comp.course;
  const ch=Math.round(idx*(Number(c.slope)||113)/113+((Number(c.rating)||coursePar(c))-coursePar(c)));
  return Math.round(ch*(Number(comp.allowance)||100)/100);
}
function holeStrokes(ph,si){
  if(ph>=0)return Math.floor(ph/18)+(si<=ph%18?1:0);
  const n=-ph;return -(Math.floor(n/18)+(si>18-(n%18)?1:0));
}
function scoreAt(e,h){const p=pending[e.id];const v=p&&p[h]!==undefined?p[h]:(e.scores||{})[h];return v===undefined?null:v}
function evalEntry(e,comp){
  const c=comp.course,ph=playingHcp(e,comp),holes=[];
  let thru=0,gross=0,pts=0,netTP=0,grossTP=0,pickup=false;
  for(let i=0;i<18;i++){
    const par=c.pars[i],si=c.si[i],rec=holeStrokes(ph,si),v=scoreAt(e,i+1);
    const h={par,si,rec,g:v,net:null,pts:null};
    if(v==="P"){h.pts=0;pickup=true;thru++}
    else if(typeof v==="number"){h.net=v-rec;h.pts=Math.max(0,2+par-h.net);gross+=v;pts+=h.pts;netTP+=h.net-par;grossTP+=v-par;thru++}
    holes.push(h);
  }
  return {key:e.id,name:dispName(e,comp),sub:dispMembers(e.members,comp),e,ph,phLabel:String(ph),holes,thru,gross,pts,netTP,grossTP,pickup,complete:thru===18};
}
function hasTeams(comp){return !!(comp.teams&&comp.teams.enabled)&&(comp.format==="stroke"||comp.format==="stableford")}
function teamAllowance(comp){const a=Number(comp.teams&&comp.teams.allowance);return a>0?a:85}
function teamRows(comp,entries,sideGame){
  const groups=new Map();
  const tc=sideGame?Object.assign({},comp,{allowance:teamAllowance(comp)}):comp;
  entries.forEach(e=>{const t=(e.team||"").trim();if(!t&&sideGame)return;const k=t||("Unpaired: "+dispName(e,comp));if(!groups.has(k))groups.set(k,[]);groups.get(k).push(evalEntry(e,tc))});
  return [...groups].map(([name,evs])=>{
    const holes=[];let thru=0,pts=0;
    for(let i=0;i<18;i++){
      const vals=evs.map(v=>v.holes[i].pts).filter(x=>x!=null);
      const best=vals.length?Math.max(...vals):null;
      holes.push({par:comp.course.pars[i],si:comp.course.si[i],pts:best});
      if(best!=null){thru++;pts+=best}
    }
    return {key:"t:"+name,name,sub:evs.map(v=>v.name).join(" & "),phLabel:evs.map(v=>v.ph).join(" · "),members:evs,holes,thru,pts,pickup:false,complete:thru===18,team:true};
  });
}
function segs(r,mode){
  const H=r.holes;
  if(mode==="pts"){const s=(a,b)=>{let t=0;for(let i=a;i<b;i++)t+=H[i].pts||0;return t};return [s(9,18),s(12,18),s(15,18),s(17,18)]}
  const s=(a,b)=>{let t=0;for(let i=a;i<b;i++)t+=H[i].g;return t};const ph=mode==="net"?r.ph:0;
  return [s(9,18)-ph/2,s(12,18)-ph/3,s(15,18)-ph/6,s(17,18)-ph/18];
}
function buildBoard(comp,entries,mode,kind){
  const side=kind==="team";
  const points=side||FORMATS[comp.format].scoring==="points";
  const rows=side||comp.format==="betterball"?teamRows(comp,entries,side):entries.map(e=>evalEntry(e,comp));
  const segMode=points?"pts":mode;
  rows.forEach(r=>{r.started=r.thru>0;r.nr=!points&&r.pickup;r.main=points?r.pts:(mode==="net"?r.netTP:r.grossTP);r.sg=r.complete&&!r.nr?segs(r,segMode):null});
  const sign=points?-1:1;
  const cmpMain=(a,b)=>{
    if(a.started!==b.started)return a.started?-1:1;
    if(a.nr!==b.nr)return a.nr?1:-1;
    if(!a.started||a.nr)return 0;
    return (a.main-b.main)*sign;
  };
  /* Countback compares completed cards only; within a tied score, finished cards sort ahead of unfinished ones. */
  const cmpCb=(a,b)=>{
    if(!a.sg||!b.sg)return a.sg?-1:b.sg?1:0;
    for(let i=0;i<4;i++){const d=(a.sg[i]-b.sg[i])*sign;if(Math.abs(d)>1e-9)return d}
    return 0;
  };
  rows.sort((a,b)=>cmpMain(a,b)||cmpCb(a,b)||(b.thru-a.thru)||a.name.localeCompare(b.name));
  /* Positions go by groups on the same score. If anyone in the group hasn't finished, the whole group is tied
     (countback can't be applied yet). If everyone has finished, countback separates them (marked C/B);
     anyone still level after countback stays tied. */
  rows.forEach(r=>{r.cb=false;r.tie=false;r.posN=0;r.pos=!r.started?"–":r.nr?"NR":""});
  for(let i=0;i<rows.length;){
    const r=rows[i];
    if(!r.started||r.nr){i++;continue}
    let j=i;while(j+1<rows.length&&rows[j+1].started&&!rows[j+1].nr&&cmpMain(r,rows[j+1])===0)j++;
    const grp=rows.slice(i,j+1);
    if(grp.length>1&&!grp.every(x=>x.sg))grp.forEach(x=>{x.posN=i+1;x.tie=true});
    else grp.forEach((x,k)=>{
      const prev=grp[k-1],next=grp[k+1];
      const sameAsPrev=prev&&cmpCb(prev,x)===0,sameAsNext=next&&cmpCb(x,next)===0;
      x.posN=sameAsPrev?prev.posN:i+k+1;
      x.tie=!!(sameAsPrev||sameAsNext);
      x.cb=grp.length>1&&!x.tie;
    });
    i=j+1;
  }
  rows.forEach(r=>{if(r.posN)r.pos=(r.tie?"T":"")+r.posN});
  return {rows,points};
}
function toPar(n){if(n===0)return '<span class="o">E</span>';return n<0?'<span class="u">'+n+'</span>':'<span class="o">+'+n+'</span>'}
function mark(g,par){
  if(g==null||g==="")return "";
  if(g==="P")return '<span class="mk">P</span>';
  const d=g-par,cls=d<=-2?"eagle":d===-1?"birdie":d===1?"bogey":d>=2?"dbl":"";
  return '<span class="mk '+cls+'">'+g+'</span>';
}
function holeWord(g,par){
  if(g==="P")return "Picked up";
  const d=g-par;
  return ({"-3":"Albatross","-2":"Eagle","-1":"Birdie","0":"Par","1":"Bogey","2":"Double bogey","3":"Triple bogey"})[d]||(d<-3?"Condor":"+"+d);
}

/* ---------- data ---------- */
function curComp(){if(S.compId==="sample")return SAMPLE;return S.comps.find(c=>c.id===S.compId)||null}
function curEntries(){if(S.compId==="sample")return SAMPLE_ENTRIES;return S.entries[S.compId]||[]}
let compsUnsub=null,entriesUnsub=null,entriesFor=null;
function subscribeComps(){
  const t=setTimeout(()=>{if(!S.compsLoaded){S.compsSlow=true;render()}},10000);
  compsUnsub=S.db.collection("comps").onSnapshot(snap=>{
    S.comps=snap.docs.map(d=>Object.assign({id:d.id},d.data())).filter(c=>c.course&&Array.isArray(c.course.pars));
    S.comps.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    if(!snap.metadata.fromCache){S.compsLoaded=true;S.compsSlow=false;clearTimeout(t)}
    else if(snap.size)S.compsLoaded=true;
    render(true);
  },err=>{clearTimeout(t);S.compsLoaded=true;S.dbState="error";toast("Competitions couldn't load ("+err.code+"). Reload the page to try again.");render()});
}
function subscribeEntries(id){
  if(entriesFor===id)return;
  if(entriesUnsub){entriesUnsub();entriesUnsub=null}
  entriesFor=id;
  subscribeShouts(id);
  if(!S.db||!id||id==="sample")return;
  checkJoined(id);
  entriesUnsub=S.db.collection("comps/"+id+"/players").onSnapshot(snap=>{
    S.entries[id]=snap.docs.map(d=>Object.assign({id:d.id},d.data()));
    S.entries[id].sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
    S.entriesLoaded[id]=true;render(true);
  },err=>{S.entriesLoaded[id]=true;toast("Scores couldn't load ("+err.code+").");render()});
}
/* ---------- under-par shouts ----------
   When a marker moves off a hole, anyone in their card who scored under par on it gets a shout:
   comps/{id}/shouts/{entryId}_{hole} = {pid, hole, score, par, at, dismissed}. Everyone viewing the
   competition sees it as a floating banner until they dismiss it; dismissing only hides it in that
   browser (remembered in localStorage). The name and score are read from the live entry, so a
   corrected score drops the banner. */
const SAMPLE_SHOUTS=[];
const SAMPLE_HIDDEN=[];
function hiddenShouts(comp){return comp.local?SAMPLE_HIDDEN:(LS.get("shoutsHidden:"+comp.id)||[])}
let shoutsUnsub=null;S.shouts={};
function subscribeShouts(id){
  if(shoutsUnsub){shoutsUnsub();shoutsUnsub=null}
  renderShouts();
  if(!S.db||!id||id==="sample")return;
  shoutsUnsub=S.db.collection("comps/"+id+"/shouts").onSnapshot(snap=>{S.shouts[id]=snap.docs.map(d=>Object.assign({id:d.id},d.data()));renderShouts()},()=>{});
}
function shoutTime(s){return s.at&&s.at.toMillis?s.at.toMillis():(s.t||Date.now())}
function activeShouts(comp){
  const list=comp.local?SAMPLE_SHOUTS:(S.shouts[comp.id]||[]),entries=curEntries(),hidden=hiddenShouts(comp);
  return list.filter(s=>!hidden.includes(s.id)).map(s=>{
    const e=entries.find(x=>x.id===s.pid),hole=Number(s.hole),par=comp.course.pars[hole-1],v=e&&scoreAt(e,hole);
    return e&&typeof v==="number"&&v<par?{s,e,hole,par,v,t:shoutTime(s)}:null;
  }).filter(Boolean).sort((a,b)=>b.t-a.t).slice(0,3);
}
function renderShouts(){
  const box=$("#shouts");if(!box)return;
  const comp=S.view==="comp"?curComp():null;
  if(!comp){box.innerHTML="";box.dataset.html="";return}
  const html=activeShouts(comp).map(x=>'<div class="shout" role="status"><span class="w">'+esc(holeWord(x.v,x.par))+'</span><span class="d"><b>'+esc(dispName(x.e,comp))+'</b> made '+x.v+' on hole '+x.hole+' (par '+x.par+')</span><button class="x" data-shout-x="'+esc(x.s.id)+'" aria-label="Dismiss" title="Dismiss">×</button></div>').join("");
  if(box.dataset.html!==html){box.innerHTML=html;box.dataset.html=html}/* unchanged banners don't re-animate */
}
function myCard(comp){
  const entries=curEntries();
  let g=(LS.get(groupKey(comp))||[]).filter(id=>entries.some(e=>e.id===id));
  if(comp.local&&!LS.get(groupKey(comp)))g=["s3","s5"];
  return g.map(id=>entries.find(e=>e.id===id)).filter(Boolean);
}
function announceHole(comp,hole){
  if(!comp||!canScore(comp)||!(hole>=1&&hole<=18))return;
  const par=comp.course.pars[hole-1];
  const sentKey="shouted:"+comp.id,sent=comp.local?[]:(LS.get(sentKey)||[]);/* the sample's shouts live in memory only */
  const have=comp.local?SAMPLE_SHOUTS:(S.shouts[comp.id]||[]);
  myCard(comp).forEach(e=>{
    const v=scoreAt(e,hole),id=e.id+"_"+hole;
    if(typeof v!=="number"||v>=par||sent.includes(id)||have.some(s=>s.id===id))return;
    sent.push(id);
    const doc={pid:e.id,hole,score:v,par,dismissed:false};
    if(comp.local)SAMPLE_SHOUTS.push(Object.assign({id,t:Date.now()},doc));
    else S.db.doc("comps/"+comp.id+"/shouts/"+id).set(Object.assign(doc,{at:S.db.now()})).catch(()=>{});
  });
  if(!comp.local)LS.set(sentKey,sent.slice(-200));
  renderShouts();
}
function dismissShout(comp,id){
  const hidden=hiddenShouts(comp);
  if(!hidden.includes(id))hidden.push(id);
  if(!comp.local)LS.set("shoutsHidden:"+comp.id,hidden.slice(-300));
  renderShouts();
}
function writeErr(err){
  if(err&&err.code==="permission-denied"){toast("That change isn't allowed from this phone. Enter the competition code, or sign in as an organiser.");render();return}
  toast("That didn't save ("+(err&&err.code||"error")+"). Check your connection and try again.");
}
const timers={},inflight={};
function setScore(e,hole,val){
  const comp=curComp();
  if(comp.local){if(val==null)delete e.scores[hole];else e.scores[hole]=val;render();return}
  (pending[e.id]||(pending[e.id]={}))[hole]=val;render();
  clearTimeout(timers[e.id]);timers[e.id]=setTimeout(()=>flush(comp.id,e.id),450);
}
async function flush(cid,pid){
  if(inflight[pid]){clearTimeout(timers[pid]);timers[pid]=setTimeout(()=>flush(cid,pid),300);return}
  const p=pending[pid];if(!p||!Object.keys(p).length)return;
  const batch=Object.assign({},p);inflight[pid]=true;
  const upd={};for(const k in batch)upd["scores."+k]=batch[k]==null?S.db.del():batch[k];/* field paths so other holes are kept */
  try{await S.db.doc("comps/"+cid+"/players/"+pid).update(upd)}
  catch(err){writeErr(err)}
  finally{inflight[pid]=false;for(const k in batch)if(pending[pid]&&pending[pid][k]===batch[k])delete pending[pid][k];render()}
}
/* Organisers (Google sign-in, listed in /admins) can change everything; players who entered a
   competition's code can only enter scores in it. The sample round is editable on-screen by anyone. */
function canAdmin(){return S.compId==="sample"||(!!S.db&&S.isAdmin)}
function canScore(comp){if(!comp)return false;if(comp.local)return true;return !!S.db&&(S.isAdmin||!!S.joined[comp.id])}
/* Until a phone has unlocked scoring for a competition (or is an organiser), players are shown as
   "First L." and NZ Golf numbers are hidden. Team names in a scramble are left as they are. */
function canSeeDetails(comp){return !!comp&&(comp.local||canScore(comp))}
function shortName(n){const p=String(n||"").trim().split(/\s+/).filter(Boolean);return p.length<2?(p[0]||""):p[0]+" "+p[p.length-1].charAt(0).toUpperCase()+"."}
function dispName(e,comp){return comp&&comp.format!=="scramble"&&!canSeeDetails(comp)?shortName(e.name):e.name}
function dispMembers(s,comp){return !s||canSeeDetails(comp)?(s||""):String(s).split(",").map(shortName).filter(Boolean).join(", ")}
function codeOf(c){return c.local?c.code:(S.secrets[c.id]||"")}
let secretsUnsub=null;
function subscribeSecrets(){
  if(secretsUnsub)secretsUnsub();
  secretsUnsub=S.db.collection("secrets").onSnapshot(snap=>{const m={};snap.docs.forEach(d=>m[d.id]=d.data().code||"");S.secrets=m;render(true)},()=>{});
}
async function checkJoined(id){
  /* Skipped while a join is in flight: the offline cache shows the new member record before the
     server has accepted or rejected the code. */
  if(!S.db||!S.authUser||!id||id==="sample"||S.joined[id]||S.joining===id)return;
  try{const d=await S.db.doc("comps/"+id+"/members/"+S.authUser.uid).get();if(d.exists()&&S.joining!==id){S.joined[id]=true;render(true)}}catch(e){}
}
async function joinComp(comp,code){
  S.joining=comp.id;
  try{
    if(!S.authUser)await S.fb.signInAnon();
    const uid=S.fb.auth.currentUser.uid;
    await S.db.doc("comps/"+comp.id+"/members/"+uid).set({code,joinedAt:S.db.now()});
    S.joined[comp.id]=true;
  }catch(e){delete S.joined[comp.id];throw e}
  finally{S.joining=null}
}

/* ---------- toast ---------- */
let toastT;function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,4200)}

/* ---------- routing ---------- */
function route(){
  const h=(location.hash||"").slice(1);
  let m;
  S.confirm=null;
  /* Leaving Enter scores also counts as moving on from the current hole (e.g. after the 18th). */
  if(S.view==="comp"&&S.tab==="score"){const pc=curComp();if(pc&&h!=="c-"+pc.id+"-score")announceHole(pc,S.hole)}
  if(h==="new"){S.view="new";S.compId=null}
  else if((m=/^c-([A-Za-z0-9_-]+?)(?:-(board|score|setup|stats))?$/.exec(h))){
    if(S.compId!==m[1]){S.openCard=null;S.editEntry=null;S.hole=(LS.get("hole:"+m[1])||1)}
    S.view="comp";S.compId=m[1];S.tab=m[2]||"board";
    if(S.tab==="stats"){S.tab="board";S.statsOpen=true}/* old Stats-tab links open the leaderboard with Stats expanded */
  }else{S.view="home";S.compId=null}
  subscribeEntries(S.view==="comp"?S.compId:null);
  render();window.scrollTo(0,0);
}
function go(h){if(location.hash==="#"+h)route();else location.hash=h}

/* ---------- render ---------- */
function render(fromSnapshot){
  renderShouts();
  const conn=$("#conn");
  conn.innerHTML=S.dbState==="live"?'<span class="pill">Live scoring</span>':S.dbState==="offline"?'<span class="pill warn">Not connected</span>':S.dbState==="connecting"?"Connecting…":"";
  const u=S.authUser,authEl=$("#auth");
  authEl.innerHTML=!S.fb?"":u&&!u.isAnonymous
    ?'<span class="who-chip" title="'+esc(u.email||"")+'">'+esc(S.isAdmin?"Organiser: ":"")+esc(u.displayName||u.email||"Signed in")+'</span><button class="ghost" data-signout>Sign out</button>'
    :'<button class="ghost" data-signin>Organiser sign in</button>';
  const app=$("#app");
  if(S.view==="home")return renderHome(app);
  if(S.view==="new")return fromSnapshot?null:renderCompForm(app,null);
  const comp=curComp();
  if(!comp){app.innerHTML=S.compsLoaded||!S.db?'<div class="panel empty stack"><h2>Competition not found</h2><p class="muted">It may have been deleted, or the link is incomplete.</p><div><a class="btn" href="#home">All competitions</a></div></div>':'<p class="muted">Loading competition…</p>';return}
  if(S.tab==="setup"&&fromSnapshot&&document.getElementById("setup-root")){renderEntryList(comp);const cv=$("#courseView");if(cv)cv.outerHTML=courseView(comp);return}
  if(fromSnapshot&&document.activeElement&&document.activeElement.id==="j-code")return;/* don't wipe a code being typed */
  renderComp(app,comp);
}

function renderHome(app){
  let h='<div class="stack">';
  h+='<div class="comp-head"><div><h1>Competitions</h1></div>';
  if(canAdmin())h+='<a class="btn primary" href="#new">New competition</a>';
  h+='</div>';

  const entries=curEntries();

  if(!entries.length){tab.innerHTML='<div class="panel empty stack"><h2>No one in the field yet</h2><p class="muted">Add players under Field &amp; course, then scores appear here as they come in.</p><div><button data-go="c-'+esc(comp.id)+'-setup">Add players</button></div></div>';return}
  const teams=hasTeams(comp),kind=teams&&S.boardKind==="team"?"team":"ind";
  const isPairs=kind==="team"||comp.format==="betterball";
  const mode=kind==="ind"&&f.scoring==="strokes"?S.boardMode:"pts";
  const {rows,points}=buildBoard(comp,entries,mode,kind);
  let h='';
  if(teams){
    h+='<div class="seg kind" role="group" aria-label="Competition" style="margin-bottom:14px"><button aria-pressed="'+(kind==="ind")+'" data-kind="ind">Individual<span class="lg">&nbsp;· '+esc(f.label)+'</span></button><button aria-pressed="'+(kind==="team")+'" data-kind="team">Pairs<span class="lg">&nbsp;· Better-ball Stableford</span></button></div>';
  }

    tab.innerHTML=h+'<div class="panel empty stack"><h2>No pairs yet</h2><p class="muted" style="max-width:60ch">Give both partners the same pair name under Field &amp; course. Their individual scores feed this leaderboard automatically, off '+teamAllowance(comp)+'% of handicap.</p><div><button data-go="c-'+esc(comp.id)+'-setup">Set up pairs</button></div></div>';

  const done=rows.filter(r=>r.complete).length,started=rows.filter(r=>r.started).length;
  h+='<div class="row" style="justify-content:space-between;margin-bottom:12px"><div class="row">';

  h+='<span class="note">'+done+' of '+rows.length+' '+(isPairs?"pairs":comp.format==="scramble"?"teams":"cards")+' complete';
  if(kind==="team"){const unp=entries.filter(e=>!(e.team||"").trim()).length;h+=' · '+teamAllowance(comp)+'% allowance'+(unp?' · '+unp+' player'+(unp===1?'':'s')+' not in a pair':'')}
  h+='</span></div>';
  if(!points)h+='<div class="seg" role="group" aria-label="Leaderboard type"><button aria-pressed="'+(S.boardMode==="net")+'" data-mode="net">Net</button><button aria-pressed="'+(S.boardMode==="gross")+'" data-mode="gross">Gross</button></div>';
  h+='</div><div class="board-wrap"><table class="board"><thead><tr><th>Pos</th><th>'+(isPairs?"Pair":comp.format==="scramble"?"Team":"Player")+'</th><th>Thru</th><th class="c-wide">'+(comp.format==="scramble"?"Team hcp":"HCP")+'</th>';
  /* Stroke play also shows each player's Stableford points (same handicap and allowance), for interest. */
  const showPts=!points&&comp.format==="stroke";
  h+=points?'<th>Pts</th>':'<th class="c-wide">Gross</th><th class="c-wide">'+(mode==="net"?"Net":"")+'</th>'+(showPts?'<th class="c-wide" title="Stableford points">Pts</th>':'')+'<th>To par</th>';
  h+='</tr></thead><tbody>';
  const cols=points?5:(showPts?8:7);
  rows.forEach(r=>{
    const thru=!r.started?"–":r.complete?"F":r.thru;
    const grossTxt=r.started&&!r.nr?String(r.gross):"";
    const netTxt=!points&&mode==="net"&&r.complete&&!r.nr?String(r.gross-r.ph):"";
    const ptsTxt=showPts&&r.started?String(r.pts):"";
    /* Phone sub-line (HTML; each piece escaped). Net is bold, matching the Net column. */
    const mline=[esc('Hcp '+r.phLabel)].concat(points?[]:[grossTxt?esc(grossTxt+' gross'):'',netTxt?'<b class="netv">'+esc(netTxt+' net')+'</b>':'',ptsTxt?esc(ptsTxt+' pts'):'']).filter(Boolean).join(' · ');
    h+='<tr class="ent" data-card="'+esc(r.key)+'" aria-expanded="'+(S.openCard===r.key)+'"><td class="pos">'+esc(r.pos)+(r.cb?'<span class="cb" title="Decided on countback">C/B</span>':'')+'</td>';
    h+='<td><div class="nm">'+esc(r.name)+'</div>'+(r.sub?'<div class="sub">'+esc(r.sub)+'</div>':'')+'<div class="sub m-line">'+mline+'</div></td><td>'+thru+'</td><td class="c-wide">'+esc(r.phLabel)+'</td>';
    if(points)h+='<td><span class="big">'+(r.started?r.pts:"–")+'</span></td>';
    else{
      h+='<td class="c-wide">'+(r.complete&&!r.nr?r.gross:r.started?'<span class="muted">'+(r.nr?"NR":r.gross)+'</span>':"–")+'</td>';
      h+='<td class="c-wide">'+(netTxt?'<b class="netv">'+netTxt+'</b>':'')+'</td>';
      if(showPts)h+='<td class="c-wide">'+(r.started?(r.complete?ptsTxt:'<span class="muted">'+ptsTxt+'</span>'):"–")+'</td>';
      h+='<td><span class="big">'+(!r.started?"–":r.nr?'<span class="muted">NR</span>':toPar(r.main))+'</span></td>';
    }
    h+='</tr>';
    if(S.openCard===r.key)h+='<tr class="card-row"><td colspan="'+cols+'">'+cardHtml(comp,r,points)+'</td></tr>';
  });
  h+='</tbody></table></div>';
  h+='<p class="note" style="margin-top:10px">Tap a row to see the card. '+(points?'Stableford points: 2 for a net par, 1 more per stroke under.':'NR: no return, the player picked up on a hole.')+' Ties on completed cards go to countback over the last 9, 6, 3 and 1 holes'+(points?'':(mode==="net"?', using ½, ⅓, ⅙ and 1/18 of the handicap':''))+'.</p>';
  h+=statsSection(comp);
  tab.innerHTML=h;
  const sb=$("#statsBox");if(sb)sb.ontoggle=()=>{S.statsOpen=sb.open};
}
function cardHtml(comp,r,points){
  const c=comp.course;
  const lines=r.team?r.members:[r];
  const range=(a,b)=>{const o=[];for(let i=a;i<b;i++)o.push(i);return o};
  const half=(idx,lbl)=>idx.map(i=>'<'+lbl+'>'+(i+1)+'</'+lbl+'>').join("");
  let h='<div class="sc-wrap"><table class="sc"><thead><tr><th class="lbl">Hole</th>'+half(range(0,9),"th")+'<th>Out</th>'+half(range(9,18),"th")+'<th>In</th><th>Tot</th></tr></thead><tbody>';
  const rowOf=(lbl,fn,tot)=>{let s='<tr><td class="lbl">'+lbl+'</td>';range(0,9).forEach(i=>s+='<td>'+fn(i)+'</td>');s+='<td class="tot">'+tot(0,9)+'</td>';range(9,18).forEach(i=>s+='<td>'+fn(i)+'</td>');s+='<td class="tot">'+tot(9,18)+'</td><td class="tot">'+tot(0,18)+'</td></tr>';return s};
  const sp=(a,b)=>sum(c.pars.slice(a,b));
  h+=rowOf("Par",i=>c.pars[i],sp);
  h+=rowOf("S.I.",i=>c.si[i],()=>"");
  lines.forEach(L=>{
    const hasP=L.holes.some(x=>x.g==="P");
    h+=rowOf(r.team?esc(String(L.name).slice(0,12)):"Score",i=>mark(L.holes[i].g,c.pars[i])+(L.holes[i].rec>0?'<div class="dots">'+"•".repeat(L.holes[i].rec)+'</div>':""),(a,b)=>{if(hasP&&b-a===18)return"NR";let t=0,any=false;for(let i=a;i<b;i++){if(typeof L.holes[i].g==="number"){t+=L.holes[i].g;any=true}}return any?t:""});
    if(points)h+=rowOf("Pts",i=>L.holes[i].pts==null?"":L.holes[i].pts,(a,b)=>{let t=0;for(let i=a;i<b;i++)t+=L.holes[i].pts||0;return t});
  });
  if(r.team)h+=rowOf("Best",i=>r.holes[i].pts==null?"":'<b>'+r.holes[i].pts+'</b>',(a,b)=>{let t=0;for(let i=a;i<b;i++)t+=r.holes[i].pts||0;return '<b>'+t+'</b>'});
  h+='</tbody></table></div>';
  return h;
}

/* ---------- stats ---------- */
/* Score types against par (gross). A pickup counts as "worse". */
/* [key, heading, short heading for phones, full description] */
const STAT_COLS=[["eagle","Eagle+","Eagle","Eagle or better"],["birdie","Birdie","Birdie","Birdie"],["par","Par","Par","Par"],["bogey","Bogey","Bogey","Bogey"],["dbl","Double","Dbl","Double bogey"],["worse","Worse","Worse","Triple bogey or worse, or a pickup"]];
function statType(g,par){
  if(g==="P")return "worse";
  const d=g-par;
  return d<=-2?"eagle":d===-1?"birdie":d===0?"par":d===1?"bogey":d===2?"dbl":"worse";
}
/* Collapsible Stats section shown under the leaderboard. Closed by default; stays open across live updates. */
function statsSection(comp){
  const entries=curEntries();
  if(!entries.length)return "";
  const rows=entries.map(e=>{
    const n={eagle:0,birdie:0,par:0,bogey:0,dbl:0,worse:0};let played=0;
    for(let h=1;h<=18;h++){const v=scoreAt(e,h);if(v==null)continue;n[statType(v,comp.course.pars[h-1])]++;played++}
    return {name:dispName(e,comp),n,played};
  }).sort((a,b)=>a.name.localeCompare(b.name));
  const dotsFor=(k,c,full)=>c?'<span class="sdots" title="'+c+' × '+esc(full)+'">'+('<i class="sd '+k+'"></i>').repeat(c)+'</span><span class="sr">'+c+'</span>':'<span class="sr">0</span>';
  let h='<details class="stats-box" id="statsBox"'+(S.statsOpen?' open':'')+'><summary><span class="sum-t">Stats</span><span class="sum-d">Eagles, birdies, pars and more for each player</span><svg class="chev" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></summary>';
  h+='<div class="stack stats-body"><div><h3>Score types</h3><p class="note" style="margin:4px 0 0">One dot for each hole, by gross score against par. A pickup counts as Worse.</p></div>';
  h+='<div class="stats-wrap"><table class="stats"><thead><tr><th>'+(comp.format==="scramble"?"Team":"Player")+'</th>';
  STAT_COLS.forEach(([k,l,sm,full])=>{h+='<th class="'+k+'" title="'+esc(full)+'"><span class="lgl">'+l+'</span><span class="sml" aria-hidden="true">'+sm+'</span></th>'});
  h+='<th class="c-holes">Holes</th></tr></thead><tbody>';
  rows.forEach(r=>{
    h+='<tr><td class="nm">'+esc(r.name)+'</td>';
    STAT_COLS.forEach(([k,,,full])=>{h+='<td>'+dotsFor(k,r.n[k],full)+'</td>'});
    h+='<td class="c-holes num muted">'+(r.played||"–")+'</td></tr>';
  });
  h+='</tbody></table></div></div></details>';
  return h;
}

function groupKey(comp){return "grp:"+comp.id}
/* The field split by 4-ball group ("Group 1", "Group 2"... in natural order), with anyone not in a
   group last. Null when nobody is in a group. */
const NO_GROUP="Not in a group";
function fieldGroups(entries){
  if(!entries.some(e=>(e.group||"").trim()))return null;
  const m=new Map();
  entries.forEach(e=>{const g=(e.group||"").trim()||NO_GROUP;if(!m.has(g))m.set(g,[]);m.get(g).push(e)});
  return [...m].sort((a,b)=>(a[0]===NO_GROUP)-(b[0]===NO_GROUP)||a[0].localeCompare(b[0],undefined,{numeric:true,sensitivity:"base"}));
}
function renderScore(tab,comp){
  const entries=curEntries();
  if(!entries.length){tab.innerHTML='<div class="panel empty stack"><h2>Add the field first</h2><p class="muted">Scores are entered per player or team. Add them under Field &amp; course.</p><div><button data-go="c-'+esc(comp.id)+'-setup">Add players</button></div></div>';return}
  const grp=myCard(comp).map(e=>e.id);
  const f=FORMATS[comp.format],points=f.scoring==="points";
  const c=comp.course,hole=S.hole,i=hole-1;
  const chip=e=>'<button class="chip" aria-pressed="'+grp.includes(e.id)+'" data-grp="'+esc(e.id)+'">'+esc(dispName(e,comp))+'</button>';
  const groups=fieldGroups(entries);
  let h='<div class="stack"><div class="panel stack"><div><div class="eyebrow">Your card</div><p class="note" style="margin:2px 0 0">Pick who you\'re marking for, up to four.'+(groups?' Players are listed in their groups; tap <b>Mark this group</b> to pick a whole group.':'')+'</p></div>';
  if(!groups)h+='<div class="chips">'+entries.map(chip).join("")+'</div>';

    h+='<div class="cgroups">';

    });
    h+='</div>';
  }
  h+='</div>';
  if(!canScore(comp)){
    h+='<div class="panel stack"><div><div class="eyebrow">Unlock scoring</div><h3>Enter the competition code</h3><p class="note" style="margin:2px 0 0">Ask the organiser for the code. You only need to enter it once on this phone.</p></div>';
    if(!S.db)h+='<p class="note" style="margin:0">Scoring needs a connection. Check your signal and reload.</p>';
    else h+='<form id="jform" class="join" novalidate><label class="f">Competition code<input id="j-code" maxlength="12" autocomplete="off" autocapitalize="characters" spellcheck="false" value="'+esc(S.joinCode||"")+'"></label><button class="primary" type="submit" id="jSubmit"'+(S.joinBusy?" disabled":"")+'>'+(S.joinBusy?"Checking…":"Unlock")+'</button></form><span class="err" id="jErr" role="alert">'+esc(S.joinErr&&S.joinErr[comp.id]||"")+'</span>';
    h+='</div>';
  }

  if(sel.length){
    h+='<div class="panel stack"><div class="holes" role="group" aria-label="Choose hole">';
    for(let k=1;k<=18;k++){const done=sel.every(e=>scoreAt(e,k)!=null);h+='<button data-hole="'+k+'" aria-current="'+(k===hole)+'" class="'+(done?"done":"")+'" aria-label="Hole '+k+(done?", scored":"")+'">'+k+'</button>'}
    h+='</div><div class="hole-head"><button aria-label="Previous hole" data-hole="'+(hole>1?hole-1:18)+'">‹</button><div style="text-align:center"><div class="eyebrow">Hole</div><div class="h">'+hole+'</div></div><div class="meta"><span>Par <b>'+c.pars[i]+'</b></span><span>S.I. <b>'+c.si[i]+'</b></span></div><button aria-label="Next hole" data-hole="'+(hole<18?hole+1:1)+'">›</button></div>';
    sel.forEach(e=>{
      const ev=evalEntry(e,comp),H=ev.holes[i],v=H.g;
      h+='<div class="prow"><div class="who"><div class="n">'+esc(dispName(e,comp))+(H.rec?' <span class="dots" title="Strokes received on this hole">'+(H.rec>0?"•".repeat(H.rec):"+"+(-H.rec))+'</span>':'')+'</div></div>';
      const dis=canScore(comp)?"":" disabled";
      h+='<div class="stepper"><button data-step="-1" data-e="'+esc(e.id)+'" aria-label="One fewer stroke for '+esc(dispName(e,comp))+'"'+dis+'>−</button><span class="val" aria-live="polite"'+(v!=null&&v!=="P"?' aria-label="'+v+', '+esc(holeWord(v,H.par))+'"':'')+'>'+(v==null?'<span class="muted">–</span>':mark(v,H.par))+'</span><button data-step="1" data-e="'+esc(e.id)+'" aria-label="One more stroke for '+esc(dispName(e,comp))+'"'+dis+'>+</button><button class="pk" data-pick="'+esc(e.id)+'" aria-label="'+(v==="P"?"Clear score":"Picked up")+' for '+esc(dispName(e,comp))+'"'+dis+'>'+(v==null?"P":"Clear")+'</button></div></div>';
    });
    h+='<p class="note" style="margin:0">The first tap of + enters par. P marks a pickup: 0 points in Stableford, no return in stroke play.</p></div>';
  }
  h+='</div>';
  tab.innerHTML=h;
  const jf=$("#jform");
  if(jf)jf.onsubmit=async ev=>{
    ev.preventDefault();
    /* State lives in S, not the DOM: signing in redraws the page part-way through. */
    const code=$("#j-code").value.trim().toUpperCase();
    S.joinErr=S.joinErr||{};S.joinCode=code;
    if(!code){S.joinErr[comp.id]="Type the code first.";render();return}
    S.joinErr[comp.id]="";S.joinBusy=true;render();
    try{await joinComp(comp,code);S.joinCode="";toast("Scoring unlocked for "+comp.name+".")}
    catch(err){
      S.joinErr[comp.id]=err&&err.code==="permission-denied"?"That code doesn't match this competition. Check it with the organiser.":"Couldn't check the code ("+(err&&err.code||"error")+"). Check your connection and try again.";
    }
    finally{S.joinBusy=false;render()}
  };
}
function stripTP(n){return n===0?"E":n>0?"+"+n:String(n)}

function renderEntryList(comp){
  const el=$("#elist");if(!el)return;
  const entries=curEntries();
  $("#fieldCount").textContent=entries.length?entries.length+(comp.format==="scramble"?" team":" player")+(entries.length===1?"":"s"):"";
  if(!entries.length){el.innerHTML='<p class="muted" style="margin:0">Nobody entered yet.</p>';return}
  let list=entries.slice();
  /* Lowest handicap index first (plus handicaps are stored as negatives, so they come first); ties by name. */
  list.sort(byHandicap);
  let h="";
  list.forEach((e,n)=>{
    const ph=playingHcp(e,comp),played=Object.values(e.scores||{}).filter(v=>v!=null).length;

    if(canAdmin()){

    }
    h+='</div>';
  });

}
/* " (Partner L.)" for the field list: whoever else shares this entry's pair name. Display only. */
function partnerText(e,entries,comp){
  const t=(e.team||"").trim();if(!t)return "";
  const mates=entries.filter(o=>o.id!==e.id&&(o.team||"").trim()===t).map(o=>dispName(o,comp));
  return mates.length?" ("+mates.join(" & ")+")":"";
}
function fmtIdx(v){const n=Number(v)||0;return n<0?"+"+(-n):String(n)}
function parseIdx(s){s=String(s||"").trim();if(!s)return 0;let neg=false;if(s[0]==="+"){neg=true;s=s.slice(1)}const n=parseFloat(s.replace(",","."));if(isNaN(n))return NaN;return neg?-n:n}
function byHandicap(a,b){return ((Number(a.index)||0)-(Number(b.index)||0))||String(a.name||"").localeCompare(String(b.name||""))}
function randInt(n){const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%n}
/* Set the pair name on several entries at once ([[entry, team], ...]). */
async function setTeams(comp,changes){return setField(comp,"team",changes)}
/* Set one field on several entries at once ([[entry, value], ...]). */
async function setField(comp,field,changes){
  if(comp.local){changes.forEach(([e,v])=>{e[field]=v});return}
  await Promise.all(changes.map(([e,v])=>S.db.doc("comps/"+comp.id+"/players/"+e.id).update({[field]:v})));
}
/* Organiser tools: put two pairs together at random into each 4-ball, or clear all groups. */
function bindGroupTools(comp){
  const gen=$("#gGen"),clr=$("#gClear"),msg=$("#gMsg"),box=$("#gConfirm"),yes=$("#gYes"),no=$("#gNo");if(!gen)return;
  const done=()=>renderEntryList(comp);
  gen.onclick=async()=>{
    const field=curEntries();
    if(field.some(e=>(e.group||"").trim())){msg.textContent="Some players are already in a group. Clear all groups first, then create 4-balls.";return}
    const byPair=new Map();
    field.forEach(e=>{const t=(e.team||"").trim();if(t){if(!byPair.has(t))byPair.set(t,[]);byPair.get(t).push(e)}});
    const pairs=[...byPair.values()];
    if(pairs.length<2){msg.textContent="Make at least two pairs first, using Generate random pairs above.";return}
    for(let i=pairs.length-1;i>0;i--){const j=randInt(i+1);[pairs[i],pairs[j]]=[pairs[j],pairs[i]]}
    const changes=[];let n=0;
    for(let i=0;i<pairs.length;i+=2){n++;const g="Group "+n;pairs[i].concat(pairs[i+1]||[]).forEach(e=>changes.push([e,g]))}
    const unpaired=field.filter(e=>!(e.team||"").trim());
    gen.disabled=clr.disabled=true;msg.textContent="Making groups…";
    try{
      await setField(comp,"group",changes);
      msg.textContent="Made "+n+" group"+(n===1?"":"s")+"."+(pairs.length%2?" Group "+n+" is a 2-ball (odd number of pairs).":"")+(unpaired.length?" Not grouped (no pair): "+unpaired.map(e=>e.name).join(", ")+".":"");
      done();
    }catch(err){msg.textContent="";writeErr(err)}
    finally{gen.disabled=clr.disabled=false}
  };
  const closeBox=()=>{box.hidden=true;clr.disabled=gen.disabled=false};
  clr.onclick=()=>{
    if(!curEntries().some(e=>(e.group||"").trim())){msg.textContent="No one is in a group yet.";return}
    msg.textContent="";box.hidden=false;clr.disabled=gen.disabled=true;no.focus();
  };
  no.onclick=()=>{closeBox();msg.textContent="Groups kept.";clr.focus()};
  yes.onclick=async()=>{
    const grouped=curEntries().filter(e=>(e.group||"").trim());
    yes.disabled=no.disabled=true;msg.textContent="Clearing groups…";
    try{await setField(comp,"group",grouped.map(e=>[e,""]));msg.textContent="Cleared all groups.";done()}
    catch(err){msg.textContent="";writeErr(err)}
    finally{yes.disabled=no.disabled=false;closeBox()}
  };
}
function bindPairTools(comp){
  const gen=$("#pGen"),clr=$("#pClear"),msg=$("#pMsg");if(!gen)return;
  const done=()=>renderEntryList(comp);/* live competitions also refresh from the database */
  gen.onclick=async()=>{
    const field=curEntries().slice();
    if(field.some(e=>(e.team||"").trim())){msg.textContent="Some players already have a pair name. Clear all pairs first, then generate.";return}
    if(field.length<2){msg.textContent="Add at least two players first.";return}
    field.sort(byHandicap);
    const half=Math.floor(field.length/2),top=field.slice(0,half),bottom=field.slice(half),changes=[];
    top.forEach((p,i)=>{const q=bottom.splice(randInt(bottom.length),1)[0];const t="Pair "+(i+1);changes.push([p,t],[q,t])});
    gen.disabled=clr.disabled=true;msg.textContent="Drawing pairs…";
    try{
      await setTeams(comp,changes);
      msg.textContent="Drew "+top.length+" pair"+(top.length===1?"":"s")+"."+(bottom.length?" "+bottom[0].name+" has no partner (odd number of players).":"");
      done();
    }catch(err){msg.textContent="";writeErr(err)}
    finally{gen.disabled=clr.disabled=false}
  };
  /* In-page confirmation rather than the browser's confirm() pop-up, which some phone browsers,
     home-screen apps and embedded views suppress. */
  const box=$("#pConfirm"),yes=$("#pYes"),no=$("#pNo");
  const closeBox=()=>{box.hidden=true;clr.disabled=gen.disabled=false};
  clr.onclick=()=>{
    if(!curEntries().some(e=>(e.team||"").trim())){msg.textContent="No one has a pair name yet.";return}
    msg.textContent="";box.hidden=false;clr.disabled=gen.disabled=true;no.focus();
  };
  no.onclick=()=>{closeBox();msg.textContent="Pairs kept.";clr.focus()};
  yes.onclick=async()=>{
    const paired=curEntries().filter(e=>(e.team||"").trim());
    yes.disabled=no.disabled=true;msg.textContent="Clearing pairs…";
    try{await setTeams(comp,paired.map(e=>[e,""]));msg.textContent="Cleared all pairs.";done()}
    catch(err){msg.textContent="";writeErr(err)}
    finally{yes.disabled=no.disabled=false;closeBox()}
  };
}
function bindEntryForm(comp){
  const form=$("#eform");
  const reset=()=>{S.editEntry=null;form.reset();$("#eformTitle").textContent=comp.format==="scramble"?"Add a team":"Add a player";$("#eSubmit").textContent="Add";$("#eCancel").hidden=true;$("#eErr").textContent=""};
  $("#eCancel").onclick=reset;
  form.onsubmit=async ev=>{
    ev.preventDefault();
    const name=$("#e-name").value.trim(),idx=parseIdx($("#e-index").value);
    if(!name){$("#eErr").textContent="Add a name.";return}
    if(isNaN(idx)||idx<-10||idx>54){$("#eErr").textContent="Handicap must be a number between +10 and 54.";return}
    const data={name,index:idx};
    if($("#e-golfno")){
      const no=$("#e-golfno").value.replace(/\s+/g,"");
      if(no&&!/^\d{4,10}$/.test(no)){$("#eErr").textContent="NZ Golf number should be digits only, e.g. 3156846.";return}
      data.golfNo=no;
    }
    if($("#e-team"))data.team=$("#e-team").value.trim();
    if($("#e-members"))data.members=$("#e-members").value.trim();
    const editing=S.editEntry;
    if(comp.local){
      if(editing)Object.assign(SAMPLE_ENTRIES.find(e=>e.id===editing),data);
      else SAMPLE_ENTRIES.push(Object.assign({id:"s"+Date.now(),scores:{}},data));
      reset();renderEntryList(comp);return;
    }
    $("#eSubmit").disabled=true;
    try{
      if(editing)await S.db.doc("comps/"+comp.id+"/players/"+editing).update(data);
      else await S.db.collection("comps/"+comp.id+"/players").add(Object.assign({scores:{},createdAt:Date.now()},data));
      reset();toast(editing?"Saved "+name+".":"Added "+name+".");$("#e-name").focus();
    }catch(err){writeErr(err)}
    finally{$("#eSubmit").disabled=false}
  };
}
function startEdit(comp,id){

}

/* ---------- events ---------- */
document.addEventListener("click",ev=>{
  const t=ev.target.closest("button,[data-card]");if(!t)return;
  const comp=curComp();
  if(t.dataset.go){go(t.dataset.go);return}
  if(t.dataset.signin!==undefined&&S.fb){
    S.fb.google().catch(err=>{if(err&&err.code!=="auth/popup-closed-by-user"&&err.code!=="auth/cancelled-popup-request")toast("Sign-in didn't work ("+(err.code||"error")+"). Try again.")});
    return;
  }
  if(t.dataset.signout!==undefined&&S.fb){S.fb.signOut().then(()=>toast("Signed out."));return}
  if(t.dataset.mode){S.boardMode=t.dataset.mode;render();return}
  if(t.dataset.kind){S.boardKind=t.dataset.kind;S.openCard=null;LS.set("kind",S.boardKind);render();return}
  if(t.dataset.card){S.openCard=S.openCard===t.dataset.card?null:t.dataset.card;render();return}
  if(t.dataset.grpAll&&comp){
    const ids=curEntries().filter(e=>(e.group||"").trim()===t.dataset.grpAll).map(e=>e.id).slice(0,4);
    LS.set(groupKey(comp),ids);render();return;
  }
  if(t.dataset.grp&&comp){
    const entries=curEntries();let g=(LS.get(groupKey(comp))||(comp.local?["s3","s5"]:[])).filter(id=>entries.some(e=>e.id===id));
    const id=t.dataset.grp;
    if(g.includes(id))g=g.filter(x=>x!==id);else{if(g.length>=4){toast("A card holds up to four. Remove someone first.");return}g.push(id)}
    LS.set(groupKey(comp),g);render();return;
  }
  if(t.dataset.shoutX&&comp){dismissShout(comp,t.dataset.shoutX);return}
  if(t.dataset.hole&&comp){const was=S.hole;S.hole=+t.dataset.hole;if(was!==S.hole)announceHole(comp,was);LS.set("hole:"+comp.id,S.hole);render();return}
  if((t.dataset.step||t.dataset.pick)&&comp&&canScore(comp)){
    const id=t.dataset.e||t.dataset.pick,e=curEntries().find(x=>x.id===id);if(!e)return;
    const par=comp.course.pars[S.hole-1],cur=scoreAt(e,S.hole);
    let v;
    if(t.dataset.pick)v=cur==null?"P":null;
    else{const d=+t.dataset.step;if(cur==null||cur==="P")v=d>0?par:par-1;else v=Math.min(15,Math.max(1,cur+d))}
    setScore(e,S.hole,v);return;
  }
  if(t.dataset.edit&&comp){startEdit(comp,t.dataset.edit);return}
  if(t.dataset.del&&comp){
    const id=t.dataset.del;
    if(S.confirm!=="e:"+id){S.confirm="e:"+id;renderEntryList(comp);setTimeout(()=>{if(S.confirm==="e:"+id){S.confirm=null;renderEntryList(comp)}},4000);return}
    S.confirm=null;
    if(comp.local){const k=SAMPLE_ENTRIES.findIndex(e=>e.id===id);if(k>=0)SAMPLE_ENTRIES.splice(k,1);renderEntryList(comp);return}
    S.db.doc("comps/"+comp.id+"/players/"+id).delete().catch(writeErr);
  }
});
window.addEventListener("hashchange",route);

/* ---------- boot ---------- */
route();
/* A small wrapper so the rest of the app keeps its simple db.collection(path) / db.doc(path) calls. */
function makeDb(fdb){
  return {
    collection(p){const ref=fsCollection(fdb,p);return {
      onSnapshot:(cb,err)=>onSnapshot(ref,{includeMetadataChanges:true},cb,err),
      add:d=>addDoc(ref,d),
      get:()=>getDocs(ref)
    }},
    doc(p){const ref=fsDoc(fdb,p);return {
      update:d=>updateDoc(ref,d),
      set:d=>setDoc(ref,d),
      delete:()=>deleteDoc(ref),
      get:()=>getDoc(ref)
    }},
    del:()=>deleteField(),
    now:()=>serverTimestamp()
  };
}
(async function(){
  let fdb,auth;
  try{
    const app=initializeApp(firebaseConfig);
    /* Offline cache: scores entered with no signal are kept on the phone and sent when it reconnects. */
    fdb=initializeFirestore(app,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})});
    auth=getAuth(app);
  }catch(e){console.error(e);S.dbState="offline";render();return}
  S.db=makeDb(fdb);S.dbState="live";
  S.fb={auth,signInAnon:()=>signInAnonymously(auth),google:()=>signInWithPopup(auth,new GoogleAuthProvider()),signOut:()=>signOut(auth)};
  subscribeComps();
  if(S.view==="comp"){entriesFor=null;subscribeEntries(S.compId)}
  onAuthStateChanged(auth,async u=>{
    S.authUser=u;S.isAdmin=false;S.joined={};
    if(secretsUnsub){secretsUnsub();secretsUnsub=null}
    S.secrets={};
    if(u&&!u.isAnonymous){try{S.isAdmin=(await S.db.doc("admins/"+u.uid).get()).exists()}catch(e){}}
    if(S.isAdmin)subscribeSecrets();
    if(u&&S.view==="comp")checkJoined(S.compId);
    render();
  });
  render();
})();
})();
</script>
